name: Build iphoneos-arm

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      ARCHS: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg
          echo "DPKG_BIN=$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_ENV"
          echo "$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install Theos SDKs
        run: |
          TMP_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/theos/sdks.git "$TMP_DIR/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$TMP_DIR/sdks/"* "$THEOS/sdks/"
          echo "THEOS_SDKS=$THEOS/sdks" >> "$GITHUB_ENV"
          SDK_NAME="$(ls "$THEOS/sdks" | grep -E '^iPhoneOS[0-9]+\.[0-9]+\.sdk$' | sort -V | tail -n 1)"
          SDK_VERSION="${SDK_NAME#iPhoneOS}"
          SDK_VERSION="${SDK_VERSION%.sdk}"
          echo "SDKVERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "TARGET=iphone:clang:$SDK_VERSION:15.0" >> "$GITHUB_ENV"

      - name: Install AltList headers and framework
        run: |
          TMP_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/opa334/AltList.git "$TMP_DIR/AltList"
          ALT_DIR="$TMP_DIR/AltList"
          HEADER_PATH="$(find "$ALT_DIR" -name ATLApplicationListMultiSelectionController.h -print -quit)"
          if [[ -n "$HEADER_PATH" ]]; then
            HEADER_DIR="$(dirname "$HEADER_PATH")"
            mkdir -p "$THEOS/include/AltList"
            cp -R "$HEADER_DIR/"* "$THEOS/include/AltList/"
          else
            echo "AltList headers not found" >&2
            exit 1
          fi
          RELEASE_JSON="$TMP_DIR/altlist_release.json"
          python3 -c 'import urllib.request; print(urllib.request.urlopen("https://api.github.com/repos/opa334/AltList/releases/latest").read().decode("utf-8"))' > "$RELEASE_JSON"
          DEB_URL="$(python3 -c 'import json; data=json.load(open("'"$RELEASE_JSON"'"));\
for asset in data.get("assets", []):\
    name=asset.get("name","");\
    if name.endswith(".deb"):\
        print(asset.get("browser_download_url",""));\
        break')"
          if [[ -z "$DEB_URL" ]]; then
            echo "AltList release .deb not found" >&2
            exit 1
          fi
          curl -fsSL "$DEB_URL" -o "$TMP_DIR/AltList.deb"
          dpkg-deb -x "$TMP_DIR/AltList.deb" "$TMP_DIR/altlist_extract"
          FRAMEWORK_PATH="$(find "$TMP_DIR/altlist_extract" -name AltList.framework -print -quit)"
          if [[ -n "$FRAMEWORK_PATH" ]]; then
            mkdir -p "$THEOS/lib"
            cp -R "$FRAMEWORK_PATH" "$THEOS/lib/"
            if [[ -d "$FRAMEWORK_PATH/Headers" ]]; then
              mkdir -p "$THEOS/include/AltList"
              cp -R "$FRAMEWORK_PATH/Headers/"* "$THEOS/include/AltList/"
            fi
          else
            echo "AltList.framework not found in release .deb" >&2
            exit 1
          fi

      - name: Ensure dm.pl is available
        run: |
          if ! command -v dm.pl >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$HOME/.local/bin/dm.pl"
            chmod +x "$HOME/.local/bin/dm.pl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build
        run: |
          make package SDKVERSION="$SDKVERSION" TARGET="$TARGET"
