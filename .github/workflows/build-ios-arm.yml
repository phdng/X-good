name: Build iphoneos-arm

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      ARCHS: arm64
      THEOS_PLATFORM: iphoneos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg
          echo "DPKG_BIN=$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_ENV"
          echo "$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install Theos SDKs
        run: |
          TMP_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/theos/sdks.git "$TMP_DIR/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$TMP_DIR/sdks/"* "$THEOS/sdks/"
          echo "THEOS_SDKS=$THEOS/sdks" >> "$GITHUB_ENV"
          SDK_NAME="$(ls "$THEOS/sdks" | grep -E '^iPhoneOS[0-9]+\.[0-9]+\.sdk$' | sort -V | tail -n 1)"
          SDK_VERSION="${SDK_NAME#iPhoneOS}"
          SDK_VERSION="${SDK_VERSION%.sdk}"
          echo "SDKVERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "TARGET=iphone:clang:$SDK_VERSION:15.0" >> "$GITHUB_ENV"

      - name: Ensure dm.pl is available
        run: |
          if ! command -v dm.pl >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$HOME/.local/bin/dm.pl"
            chmod +x "$HOME/.local/bin/dm.pl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build
        run: |
          make clean
          make package ARCHS="$ARCHS" SDKVERSION="$SDKVERSION" TARGET="$TARGET"

      - name: Debug - Check dylib constructors
        run: |
          echo "=== Checking dylib for constructor symbols ==="
          DYLIB_PATH=".theos/obj/arm64/ProjectXTweak.dylib"
          if [ -f "$DYLIB_PATH" ]; then
            echo "--- otool -l (looking for __mod_init_func) ---"
            otool -l "$DYLIB_PATH" | grep -A10 "__mod_init_func" || echo "NO __mod_init_func section found!"
            echo "--- nm (looking for constructors) ---"
            nm "$DYLIB_PATH" 2>/dev/null | grep -i "ctor\|init\|AAA" | head -20 || echo "nm failed or no matches"
            echo "--- strings (looking for test constructor) ---"
            strings "$DYLIB_PATH" | grep -i "AAA_TestCtor\|weaponx_ctor" | head -10
          else
            echo "Dylib not found at $DYLIB_PATH"
            find .theos -name "*.dylib" 2>/dev/null
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: projectx-build
          path: |
            packages/*.deb
            .theos/obj/**/ProjectX.app
            .theos/obj/**/ProjectXTweak.dylib
            .theos/obj/**/ProjectXDaemon
          if-no-files-found: warn
