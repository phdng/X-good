name: Build iphoneos-arm

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      ARCHS: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          brew update
          brew install ldid dpkg

      - name: Ensure dm.pl available
        run: |
          DPKG_PREFIX="$(brew --prefix dpkg)"
          DMPL="$(find "$DPKG_PREFIX" -name dm.pl -print -quit)"
          if [[ -n "$DMPL" && -f "$DMPL" ]]; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$DMPL" "$HOME/.local/bin/dm.pl"
          else
            echo "dm.pl not found under $DPKG_PREFIX" >&2
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make package
