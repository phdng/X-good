name: Build iphoneos-arm

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      ARCHS: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          brew update
          brew install ldid dpkg

      - name: Ensure dm.pl available
        run: |
          DMPL="$(brew --prefix dpkg)/libexec/dpkg/dm.pl"
          if [[ -f "$DMPL" ]]; then
            sudo ln -sf "$DMPL" /usr/local/bin/dm.pl
          else
            echo "dm.pl not found at $DMPL" >&2
            exit 1
          fi
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make package
