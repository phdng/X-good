name: Build iphoneos-arm

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      ARCHS: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg
          echo "DPKG_BIN=$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_ENV"
          echo "$(brew --prefix dpkg)/libexec/dpkg" >> "$GITHUB_PATH"

      - name: Set up Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install Theos SDKs
        run: |
          TMP_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/theos/sdks.git "$TMP_DIR/sdks"
          mkdir -p "$THEOS/sdks"
          cp -R "$TMP_DIR/sdks/"* "$THEOS/sdks/"

      - name: Install AltList headers and libs
        run: |
          TMP_DIR="$(mktemp -d)"
          git clone --depth=1 https://github.com/opa334/AltList.git "$TMP_DIR/AltList"
          ALT_DIR="$TMP_DIR/AltList"
          HEADER_PATH="$(find "$ALT_DIR" -name ATLApplicationListMultiSelectionController.h -print -quit)"
          if [[ -n "$HEADER_PATH" ]]; then
            HEADER_DIR="$(dirname "$HEADER_PATH")"
            mkdir -p "$THEOS/include/AltList"
            cp -R "$HEADER_DIR/"* "$THEOS/include/AltList/"
          else
            echo "AltList headers not found" >&2
            exit 1
          fi
          if [[ -d "$ALT_DIR/lib" ]]; then
            mkdir -p "$THEOS/lib"
            cp -R "$ALT_DIR/lib/"* "$THEOS/lib/"
          fi

      - name: Select Xcode SDK
        run: |
          echo "SDKVERSION=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_ENV"
          echo "TARGET=iphone:clang:$(xcrun --sdk iphoneos --show-sdk-version):15.0" >> "$GITHUB_ENV"

      - name: Ensure dm.pl is available
        run: |
          if ! command -v dm.pl >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$HOME/.local/bin/dm.pl"
            chmod +x "$HOME/.local/bin/dm.pl"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build
        run: |
          make package SDKVERSION="$SDKVERSION" TARGET="$TARGET"
